name: Consumer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip check
      - name: Compile executable Python sources
        run: |
          python - <<'PY'
          import py_compile
          import subprocess
          from pathlib import Path
          sources = subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines()
          for source in sources:
              if "docs" not in Path(source).parts:
                  py_compile.compile(source, doraise=True)
          PY
      - run: python -m pytest -q
      - name: Verify committed optional analytics integrity
        run: |
          python - <<'PY'
          from pitch_oracle_core.pitchapi.artifacts import analytics_repository
          repository = analytics_repository(".", "ligue1")
          failures = repository.manifest.get("optional_artifact_failures", {})
          assert not failures, failures
          assert repository.descriptors, "No optional analytics artifacts were published"
          PY
